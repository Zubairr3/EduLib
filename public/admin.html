<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel | Workspace</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div id="toast" class="toast" role="alert"></div>

    <div class="navbar">
        <h2>IT Admin Control Panel</h2>
        <div class="nav-controls">
            <span id="welcomeText" style="font-weight: bold; font-size: 13px; color: #cbd5e1;"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="layout">
        <div class="feed-section">
            <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px;">
                <h3 style="margin: 0; color: #0f172a;">Global Workspace Feed</h3>
            </div>
            <div id="postsList">
                <p style="text-align: center; color: #94a3b8; padding: 40px;">Loading network data...</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="action-card">
                <h3>Issue Official Resource</h3>
                <button class="btn" style="background: #0f172a;" onclick="openModal()">+ Broadcast Resource</button>
            </div>

            <!-- COLLAPSIBLE HELPDESK WITH LABELS -->
            <div class="action-card">
                <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleHelpdesk()">
                    <h3 style="margin:0;">IT Helpdesk</h3>
                    <span id="helpdeskIcon" style="color: #64748b; font-size: 12px; font-weight: bold;">▼ Expand</span>
                </div>
                
                <div id="helpdeskContent" style="display: none; margin-top: 15px;">
                    <p style="font-size: 12px; color: #64748b; margin-top: 0;">Reset an employee's password.</p>
                    <div class="input-group">
                        <label>Employee Username</label>
                        <input type="text" id="resetUsername" placeholder="e.g., john_doe">
                    </div>
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="text" id="resetPassword" placeholder="Enter new password">
                    </div>
                    <button class="btn" onclick="resetUserPassword()" style="background: #ea580c;">Force Password Reset</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="publishModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Broadcast Official Resource</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="input-group"><label>Resource Title</label><input type="text" id="postTitle" required></div>
                <div class="input-group">
                    <label>Content Category</label>
                    <select id="postType"><option value="Official Notice">Official Notice</option><option value="Documentation">Technical Documentation</option></select>
                </div>
                <div class="input-group"><label>Attach Official File</label><input type="file" id="mediaFile"></div>
                <div class="input-group"><label>Detailed Notes</label><div id="editor-container" style="height: 180px; background: white;"></div></div>
                <button type="submit" class="btn" style="background: #0f172a; margin-top: 15px;">Broadcast Globally</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="editModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Admin: Edit Resource</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editPostId">
                <div class="input-group"><label>Resource Title</label><input type="text" id="editPostTitle" required></div>
                <div class="input-group">
                    <label>Content Category</label>
                    <select id="editPostType"><option value="Official Notice">Official Notice</option><option value="Documentation">Technical Documentation</option><option value="Research Paper">Research Paper</option></select>
                </div>
                <div class="input-group"><label>Detailed Notes</label><div id="edit-editor-container" style="height: 150px; background: white;"></div></div>
                <button type="submit" class="btn" style="margin-top: 15px; background: #0f172a;">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>

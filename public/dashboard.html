<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Dashboard | EduLib</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div id="toast" class="toast" role="alert"></div>

    <div class="navbar">
        <h2>EduLib Knowledge Hub</h2>
        <div class="nav-controls">
            <span id="welcomeText" style="font-weight: bold; font-size: 13px; color: #cbd5e1;"></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="layout">
        <div class="feed-section">
            <div class="tabs">
                <button id="tab-community" class="tab-btn active" onclick="switchTab('community')">Community Library (All)</button>
                <button id="tab-personal" class="tab-btn" onclick="switchTab('personal')">My Contributions</button>
            </div>
            <div id="postsList"><p style="text-align: center; color: #94a3b8; padding: 40px;">Loading workspace feed...</p></div>
        </div>

        <div class="sidebar">
            <div class="action-card">
                <h3>Contribute Knowledge</h3>
                <p style="font-size: 13px; color: #64748b;">Upload professional documents or write internal articles to share.</p>
                <button class="btn" onclick="openModal()">+ Share New Resource</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="publishModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Share Workspace Resource</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="input-group"><label>Resource Title</label><input type="text" id="postTitle" required></div>
                <div class="input-group">
                    <label>Content Category</label>
                    <select id="postType"><option value="Research Paper">Research Paper</option><option value="Tutorial">Tutorial / Guide</option><option value="Article">Internal Article</option></select>
                </div>
                <div class="input-group"><label>Attach File</label><input type="file" id="mediaFile" accept=".pdf, .doc, .docx, image/*, video/*"></div>
                <div class="input-group"><label>Detailed Notes</label><div id="editor-container" style="height: 180px; background: white;"></div></div>
                <div class="input-group"><label>Any Others/ URLs</label><div id="editor-container" style="height: 180px; background: white;"></div></div>
                <button type="submit" class="btn" style="margin-top: 15px;">Finalize & Publish</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="editModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Resource</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editPostId">
                <div class="input-group"><label>Resource Title</label><input type="text" id="editPostTitle" required></div>
                <div class="input-group">
                    <label>Content Category</label>
                    <select id="editPostType"><option value="Research Paper">Research Paper</option><option value="Tutorial">Tutorial / Guide</option><option value="Article">Internal Article</option></select>
                </div>
                <div class="input-group"><label>Detailed Notes</label><div id="edit-editor-container" style="height: 150px; background: white;"></div></div>
                <button type="submit" class="btn" style="margin-top: 15px;">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
